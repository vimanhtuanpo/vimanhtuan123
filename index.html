<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Construction Simulator (Browser) - Full Upgrade</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Construction Simulator (Browser) - Full Upgrade</h1>
    <div class="controls">
      <button id="addCitizen">Thêm dân</button>
      <button id="addCompany">Thêm công ty</button>
      <button id="addSite">Tạo công trường</button>
      <button id="postJob">Đăng tuyển ngẫu nhiên</button>
      <button id="tickOnce">Tick 1</button>
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <label>Speed: <input id="speed" type="range" min="1" max="10" value="2"></label>
      <button id="save">Save</button>
      <button id="load">Load</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <main>
    <div class="canvasWrap"><canvas id="world"></canvas></div>
    <aside>
      <section>
        <h2>Companies</h2>
        <div id="companies"></div>
      </section>
      <section>
        <h2>Construction Sites</h2>
        <div id="sites"></div>
      </section>
      <section>
        <h2>Citizens</h2>
        <div id="citizens"></div>
      </section>
      <section>
        <h2>Player</h2>
        <div id="playerInfo" class="item">-</div>
      </section>
      <section>
        <h2>Log</h2>
        <div id="log" class="log"></div>
      </section>
    </aside>
  </main>

  <footer>
    <small>Open with a local web server for full features. Save/load uses localStorage.</small>
  </footer>

  <!-- Core scripts (order matters) -->
  <script src="js/core/astar.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/core/supply.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui/renderer.js"></script>
  <script src="js/ui/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
